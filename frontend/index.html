    <style>
      #bb-initial-loader {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #ffffff;
        color: #1a202c;
        font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        opacity: 1;
        transition: opacity 180ms ease-out;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
      }

      #bb-initial-loader.bb-initial-loader--exit {
        opacity: 0;
        pointer-events: none;
      }

      #bb-initial-loader.bb-initial-loader--ready .bb-initial-loader__fill {
        width: 100%;
        animation: none;
        transition: width 160ms ease-out;
      }

      .bb-initial-loader__stage {
        display: flex;
        width: min(440px, 100%);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: clamp(16px, 4vw, 32px);
        box-sizing: border-box;
      }

      .bb-initial-loader__logo {
        width: clamp(60px, 14vw, 72px);
        height: clamp(60px, 14vw, 72px);
        margin: 0 0 clamp(18px, 4vh, 24px);
        object-fit: contain;
        animation: bb-initial-loader-float 2.4s ease-in-out infinite;
      }

      .bb-initial-loader__track {
        width: min(380px, 100%);
        height: 6px;
        margin-bottom: 18px;
        overflow: hidden;
        border-radius: 999px;
        background: #e9ecef;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.1);
      }

      .bb-initial-loader__fill {
        display: block;
        width: 8%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #bc0100 0%, #ef233c 55%, #1c871e 100%);
        box-shadow: 0 0 10px rgba(239, 35, 60, 0.3);
        animation: bb-initial-loader-progress 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      .bb-initial-loader__info {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 8px;
        max-width: 100%;
        flex-wrap: wrap;
      }

      .bb-initial-loader__title {
        margin: 0;
        font-size: clamp(1rem, 3.8vw, 1.15rem);
        font-weight: 700;
        line-height: 1.2;
      }

      .bb-initial-loader__badge {
        padding: 2px 10px;
        border: 1px solid #fee2e2;
        border-radius: 999px;
        background: #fef2f2;
        color: #bc0100;
        font-size: 0.72rem;
        font-weight: 600;
        line-height: 1.4;
        white-space: nowrap;
      }

      .bb-initial-loader__status {
        margin: 0;
        color: #006c0c;
        font-size: clamp(0.8rem, 3.2vw, 0.88rem);
        font-weight: 500;
        line-height: 1.4;
        text-align: center;
      }

      @keyframes bb-initial-loader-progress {
        from {
          width: 8%;
        }
        to {
          width: 88%;
        }
      }

      @keyframes bb-initial-loader-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      @media (max-width: 420px) {
        .bb-initial-loader__info {
          flex-direction: column;
          gap: 7px;
        }

        .bb-initial-loader__badge {
          white-space: normal;
          text-align: center;
        }
      }

      @media (max-height: 520px) and (orientation: landscape) {
        .bb-initial-loader__stage {
          padding-block: 12px;
        }

        .bb-initial-loader__logo {
          width: 52px;
          height: 52px;
          margin-bottom: 12px;
        }

        .bb-initial-loader__track {
          margin-bottom: 12px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #bb-initial-loader,
        .bb-initial-loader__logo,
        .bb-initial-loader__fill {
          animation: none;
          transition-duration: 1ms;
        }

        .bb-initial-loader__fill {
          width: 72%;
        }
      }
    </style>
